<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrioMatrix Pro - Priority & Focus Tracker</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
  <div class="container">
    <header>
      <div class="header-top">
        <h1>PrioMatrix Pro 🎯</h1>
        <button id="theme-toggle" class="icon-btn">☀️ Light</button>
      </div>
      <p>Scientific Task Prioritizer & Focus Suite</p>
    </header>

    <!-- Analytics Dashboard -->
    <section class="card analytics-card">
      <h2>📈 Productivity Insights</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-num" id="stat-completed">0</span>
          <span class="stat-label">Tasks Done</span>
        </div>
        <div class="stat-box">
          <span class="stat-num" id="stat-hours">0h</span>
          <span class="stat-label">Time Saved</span>
        </div>
        <div class="stat-box">
          <span class="stat-num" id="stat-focus">0m</span>
          <span class="stat-label">Focus Time</span>
        </div>
      </div>
    </section>

    <!-- Active Pomodoro Timer Bar -->
    <section id="timer-bar" class="card timer-card hidden">
      <div class="timer-info">
        <span id="timer-task-title">Working on Task...</span>
        <span id="timer-display" class="timer-clock">25:00</span>
      </div>
      <div class="timer-controls">
        <button id="pause-timer-btn" class="secondary-btn">Pause</button>
        <button id="stop-timer-btn" class="danger-btn">Stop</button>
      </div>
    </section>

    <!-- Workload Progress Bar -->
    <section class="card capacity-card">
      <div class="capacity-header">
        <span>Workload Capacity</span>
        <span id="capacity-text">0 / 40 hrs</span>
      </div>
      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>
    </section>

    <!-- Add/Edit Task Form -->
    <section class="card">
      <h2 id="form-title">Add New Task</h2>
      <form id="task-form">
        <input type="hidden" id="task-id">
        <input type="text" id="title" placeholder="Task Title" required>
        
        <div class="form-group">
          <label>Category Tag:</label>
          <select id="category">
            <option value="Work">💼 Work</option>
            <option value="Personal">🏠 Personal</option>
            <option value="Study">📚 Study</option>
            <option value="Project">🚀 Side Project</option>
          </select>
        </div>

        <div class="form-group">
          <label>Impact (1-5): <span id="impact-val">3</span></label>
          <input type="range" id="impact" min="1" max="5" value="3">
        </div>

        <div class="form-group">
          <label>Confidence (%): <span id="conf-val">80%</span></label>
          <input type="range" id="confidence" min="10" max="100" value="80" step="10">
        </div>

        <div class="form-group">
          <label>Effort (Hours):</label>
          <input type="number" id="effort" min="0.5" step="0.5" value="2" required>
        </div>

        <div class="form-group">
          <label>Due Date:</label>
          <input type="date" id="due-date" required>
        </div>

        <div class="form-group">
          <label>Subtasks (Comma Separated):</label>
          <input type="text" id="subtasks-input" placeholder="Draft outline, Review code, Submit">
        </div>

        <button type="submit" id="submit-btn" class="btn">Calculate & Add Task</button>
        <button type="button" id="cancel-edit-btn" class="secondary-btn hidden" style="width: 100%; margin-top: 8px;">Cancel Edit</button>
      </form>
    </section>

    <!-- Search, Category Filters, & Actions -->
    <section class="card">
      <div class="filter-controls">
        <input type="text" id="search-input" placeholder="🔍 Search tasks...">
        
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="high">🔥 Do First</button>
          <button class="filter-btn" data-filter="med">📅 Schedule</button>
          <button class="filter-btn" data-filter="low">💡 Backlog</button>
        </div>

        <div class="filter-buttons">
          <button class="cat-filter-btn active" data-cat="all">All Categories</button>
          <button class="cat-filter-btn" data-cat="Work">💼 Work</button>
          <button class="cat-filter-btn" data-cat="Personal">🏠 Personal</button>
          <button class="cat-filter-btn" data-cat="Study">📚 Study</button>
          <button class="cat-filter-btn" data-cat="Project">🚀 Project</button>
        </div>
      </div>

      <div class="list-header" style="margin-top: 15px;">
        <h2>Prioritized Tasks</h2>
        <div class="action-buttons">
          <button id="export-csv-btn" class="secondary-btn">📊 CSV</button>
          <button id="export-json-btn" class="secondary-btn">💾 Backup</button>
          <button id="clear-all-btn" class="danger-btn">Clear All</button>
        </div>
      </div>

      <div id="task-list"></div>
    </section>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script src="app.js"></script>
</body>
</html>
