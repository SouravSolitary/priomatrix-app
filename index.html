<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrioMatrix - Priority Tracker</title>
  
  <!-- PWA Meta & Icons -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
  <div class="container">
    <header>
      <div class="header-top">
        <h1>PrioMatrix 🎯</h1>
        <button id="theme-toggle" class="icon-btn">☀️ Light</button>
      </div>
      <p>Scientific Task & Resource Prioritizer</p>
    </header>

    <!-- Workload Progress Bar -->
    <section class="card capacity-card">
      <div class="capacity-header">
        <span>Workload Capacity</span>
        <span id="capacity-text">0 / 40 hrs</span>
      </div>
      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>
    </section>

    <!-- Add Task Form -->
    <section class="card">
      <h2>Add New Task</h2>
      <form id="task-form">
        <input type="text" id="title" placeholder="Task Title" required>
        
        <div class="form-group">
          <label>Impact (1-5): <span id="impact-val">3</span></label>
          <input type="range" id="impact" min="1" max="5" value="3">
        </div>

        <div class="form-group">
          <label>Confidence (%): <span id="conf-val">80%</span></label>
          <input type="range" id="confidence" min="10" max="100" value="80" step="10">
        </div>

        <div class="form-group">
          <label>Effort (Hours):</label>
          <input type="number" id="effort" min="0.5" step="0.5" value="2" required>
        </div>

        <div class="form-group">
          <label>Due Date:</label>
          <input type="date" id="due-date" required>
        </div>

        <button type="submit" class="btn">Calculate & Add Task</button>
      </form>
    </section>

    <!-- Search, Filters, & Controls -->
    <section class="card">
      <div class="filter-controls">
        <input type="text" id="search-input" placeholder="🔍 Search tasks...">
        
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="high">🔥 Do First</button>
          <button class="filter-btn" data-filter="med">📅 Schedule</button>
          <button class="filter-btn" data-filter="low">💡 Backlog</button>
        </div>
      </div>

      <div class="list-header" style="margin-top: 15px;">
        <h2>Prioritized Tasks</h2>
        <div class="action-buttons">
          <button id="export-csv-btn" class="secondary-btn">📊 CSV</button>
          <button id="export-json-btn" class="secondary-btn">💾 Backup</button>
          <button id="clear-all-btn" class="danger-btn">Clear All</button>
        </div>
      </div>

      <div id="task-list"></div>
    </section>
  </div>

  <!-- Canvas for Confetti -->
  <canvas id="confetti-canvas"></canvas>

  <script src="app.js"></script>
</body>
</html>
