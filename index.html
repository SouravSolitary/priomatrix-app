<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrioMatrix - Gamified Priority Tracker</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="stylesheet" href="styles.css">
  <!-- Chart.js for Interactive Progress Graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dark-theme">
  <div class="container">
    <header>
      <div class="header-top">
        <h1>PrioMatrix 🎯</h1>
        <button id="theme-toggle" class="icon-btn">☀️ Light</button>
      </div>
      <p>Gamified Scientific Task Prioritizer</p>
    </header>

    <!-- Gamification & Level Dashboard -->
    <section class="card level-card">
      <div class="level-header">
        <div>
          <span id="player-title" class="title-badge">Rank: Novice Planner</span>
          <h2 id="player-level" style="font-size: 1.4rem;">Level 1</h2>
        </div>
        <div class="xp-display">
          <span id="total-xp">0</span> <small>XP</small>
        </div>
      </div>
      <div class="progress-bar" style="margin-top: 10px;">
        <div id="xp-fill" style="background: #8b5cf6; width: 0%;"></div>
      </div>
      <span id="xp-next" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; display: block;">0 / 500 XP to Level 2</span>
    </section>

    <!-- 7-Day Efficiency Chart -->
    <section class="card">
      <div class="list-header">
        <h2>📈 7-Day Efficiency Score</h2>
        <span id="today-efficiency" class="badge high">Today: 0%</span>
      </div>
      <div style="height: 180px; margin-top: 10px;">
        <canvas id="efficiencyChart"></canvas>
      </div>
    </section>

    <!-- Add Task Form -->
    <section class="card">
      <h2>Add New Task</h2>
      <form id="task-form">
        <input type="text" id="title" placeholder="Task Title" required>
        
        <div class="form-group">
          <label>Impact (1-5): <span id="impact-val">3</span></label>
          <input type="range" id="impact" min="1" max="5" value="3">
        </div>

        <div class="form-group">
          <label>Confidence (%): <span id="conf-val">80%</span></label>
          <input type="range" id="confidence" min="10" max="100" value="80" step="10">
        </div>

        <div class="form-group">
          <label>Effort (Hours):</label>
          <input type="number" id="effort" min="0.5" step="0.5" value="2" required>
        </div>

        <div class="form-group">
          <label>Due Date:</label>
          <input type="date" id="due-date" required>
        </div>

        <button type="submit" class="btn">Calculate & Add Task</button>
      </form>
    </section>

    <!-- Task List -->
    <section class="card">
      <div class="list-header">
        <h2>Prioritized Tasks</h2>
        <button id="clear-all-btn" class="danger-btn">Clear All</button>
      </div>
      <div id="task-list"></div>
    </section>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script src="app.js"></script>
</body>
</html>
